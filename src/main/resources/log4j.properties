# Use the multicolor layout engine
log4j.appender.stdout.layout=com.jcabi.log.MulticolorLayout
log4j.appender.CONSOLE.layout.Levels=INFO:2;10,WARN:2;32
log4j.appender.CONSOLE.layout.Colors=white:10
log4j.appender.stdout.layout.ConversionPattern=\u001b[36m%d{yyyy-MM-dd HH:mm:ss} %color{%-5p} %c{1}:%L - %m%n

# Direct to a file
log4j.appender.file=org.apache.log4j.RollingFileAppender  
log4j.appender.file.File=${user.dir}\\logs\\log4j.log
log4j.appender.file.MaxFileSize=100KB
log4j.appender.file.MaxBackupIndex=2
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n


# Define the filehtml appender
log4j.appender.filehtml=org.apache.log4j.FileAppender
log4j.appender.filehtml.File=${user.dir}\\logs\\log4j.html

# Define the layout for the filehtml appender as HTMLLayout
log4j.appender.filehtml.layout=org.apache.log4j.HTMLLayout

# Optional: Title for the HTML file
log4j.appender.filehtml.layout.Title=My Application Logs
# Optional: Include location information (can impact performance)
log4j.appender.filehtml.layout.LocationInfo=true

# Root logger  
log4j.rootLogger=ALL, file, filehtml, stdout

# Direct to console
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.Target=System.out
#log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
#log4j.appender.stdout.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

#Default Levels: ERROR (red), WARN (yellow), INFO (blue), DEBUG (green)

# ANSI Color Reference Code
# You can customize the look by swapping out the code blocks (e.g., \u001b[33m) using this # guide:
# •	\u001b[31m: Red
# •	\u001b[32m: Green
# •	\u001b[33m: Yellow
# •	\u001b[34m: Blue
# •	\u001b[35m: Magenta
# • \u001b[36m: Cyan
# •	\u001b[m: Reset color (Crucial to add at the end of a colored segment so the color doesn't bleed)

#log4j.appender.stdout.layout.ConversionPattern=\u001b[34m%d{yyyy-MM-dd HH:mm:ss}\u001b[m \u001b[31m%-5p\u001b[m %c{1}:%L - %m%n


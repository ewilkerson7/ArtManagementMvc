<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Art Detail</title>
    <link rel="stylesheet" th:href="@{/webjars/github-com-twbs-bootstrap-/5.3.8/css/bootstrap.min.css}"/>
</head>
<body class="container mt-5">
<h2>Art Details</h2>
<hr>
<div class="card" style="width: 24rem;">
    <div class="card-body">
        <h5 class="card-title" th:text="${art.title}">Title</h5>
        <h6 class="card-subtitle mb-2 text-muted" th:text="${art.authorName}">Author</h6>
        <p class="card-text"><strong>ID:</strong> <span th:text="${art.id}"></span></p>
        <p class="card-text"><strong>Year:</strong> <span th:text="${art.yearCreated}"></span></p>
        <p class="card-text"><strong>Price:</strong> $<span th:text="${art.price}"></span></p>
        <p class="card-text"><strong>Description:</strong> <span th:text="${art.description}"></span></p>
        <p class="card-text"><strong>Type:</strong> <span th:text="${art.getClass().getSimpleName()}"></span></p>
    </div>
</div>
<br>
<a th:href="@{/inventory}" class="btn btn-secondary">Back to Inventory</a>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Art Inventory Management</title>
    <link rel="stylesheet" th:href="@{/webjars/github-com-twbs-bootstrap-/5.3.8/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/datatables/2.3.7/css/dataTables.bootstrap5.min.css}"/>
</head>
<body class="container mt-5">

<h2>Available Art Inventory</h2>
<a th:href="@{/inventory/add}" class="btn btn-primary mb-3">Add New Art</a>
<hr>

<table id="inventoryTable" class="table table-striped table-bordered">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Author</th>
        <th>Type</th>
        <th>Year</th>
        <th>Price</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="art : ${artPieces}">
        <td th:text="${art.id}"></td>
        <td th:text="${art.title}"></td>
        <td th:text="${art.authorName}"></td>
        <td th:text="${art.getClass().getSimpleName()}"></td>
        <td th:text="${art.yearCreated}"></td>
        <td th:text="${'$' + art.price}"></td>
        <td>
            <a th:href="@{/inventory/{id}(id=${art.id})}" class="btn btn-sm btn-info">View</a>
            <a th:href="@{/inventory/edit/{id}(id=${art.id})}" class="btn btn-sm btn-warning">Edit</a>
            <a th:href="@{/inventory/delete/{id}(id=${art.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure?');">Delete</a>
        </td>
    </tr>
    </tbody>
</table>

<script type="text/javascript" th:src="@{/webjars/jquery/4.0.0/dist/jquery.min.js}"></script>
<script type="text/javascript" th:src="@{/webjars/github-com-twbs-bootstrap-/5.3.8/js/bootstrap.min.js}"></script>
<script type="text/javascript" th:src="@{/webjars/datatables/2.3.7/js/dataTables.min.js}"></script>
<script type="text/javascript" th:src="@{/webjars/datatables/2.3.7/js/dataTables.bootstrap5.min.js}"></script>
<script>
    $(document).ready(function() {
        $('#inventoryTable').DataTable({
            "pageLength": 10,
            "ordering": true
        });
    });
</script>
</body>
</html>

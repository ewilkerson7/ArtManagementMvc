<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Art Inventory Management</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- DataTables CSS -->
    <link href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

<h2>Available Art Inventory</h2>
<hr>

<table id="inventoryTable" class="table table-striped table-bordered">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Author</th>
        <th>Type</th>
        <th>Year</th>
        <th>Price</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="art : ${artPieces}">
        <td th:text="${art.id}">1234567890</td>
        <td th:text="${art.title}">Family on the Beach</td>
        <td th:text="${art.authorName}">John Doe</td>
        <td th:text="${art.getClass().getSimpleName()}">Painting</td>
        <td th:text="${art.yearCreated}">2021</td>
        <td th:text="${'$' + art.price}">$500.00</td>
        <td>
            <button class="btn btn-sm btn-danger">Remove</button>
        </td>
    </tr>
    </tbody>
</table>

<!-- jQuery and DataTables JS -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
<script>
    $(document).ready(function() {
        $('#inventoryTable').DataTable({
            "pageLength": 10,
            "ordering": true
        });
    });
</script>
</body>
</html>
